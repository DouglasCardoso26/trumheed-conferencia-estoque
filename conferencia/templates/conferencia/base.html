<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Conferência de estoque{% endblock %} - Trumheed Automotive</title>
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita piscar).
    (function () {
      try {
        if (localStorage.getItem("tema") === "escuro") {
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      } catch (e) { /* sem armazenamento: segue no tema claro */ }
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-size: 1.125rem; background: #edf1f3; }
    [data-bs-theme="dark"] body { background: var(--bs-body-bg); }
    .btn { min-height: 48px; min-width: 48px; font-weight: 600; }
    .btn-sm { min-height: 44px; }
    .passos li { margin-right: 1.5rem; }
    .ajuste { border: 2px dashed #0f4c5c; background: #f7fbfc; border-radius: .6rem; padding: .9rem 1rem; }
    [data-bs-theme="dark"] .ajuste { background: var(--bs-tertiary-bg); border-color: #6cb2c2; }
    [data-bs-theme="dark"] .btn-outline-primary { color: #8ec5ff; border-color: #8ec5ff; }
    [data-bs-theme="dark"] .btn-outline-secondary { color: #dee2e6; border-color: #adb5bd; }
    .btn { transition: none; }
  </style>
</head>
<body>
<header class="py-2 px-3 text-white d-flex justify-content-between align-items-center flex-wrap gap-2" style="background:#0f4c5c">
  <div><strong>Trumheed Automotive</strong><br><small>Conferência de estoque</small></div>
  <div class="d-flex align-items-center gap-3">
    <button type="button" id="alternar-tema" class="btn btn-outline-light" aria-pressed="false">Modo escuro</button>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-3 m-0">
      {% csrf_token %}
      <span>Usuário: {{ user.get_username }}</span>
      <button class="btn btn-outline-light" type="submit">Sair</button>
    </form>
    {% endif %}
  </div>
</header>
<main class="container py-4">
  {% block passos %}{% endblock %}
  <h1 class="h2 mb-3">{% block cabecalho %}{% endblock %}</h1>
  {% block conteudo %}{% endblock %}
</main>
<script>
  (function () {
    var botao = document.getElementById("alternar-tema");
    var raiz = document.documentElement;
    function atualizar() {
      var escuro = raiz.getAttribute("data-bs-theme") === "dark";
      botao.textContent = escuro ? "Modo claro" : "Modo escuro";
      botao.setAttribute("aria-pressed", escuro ? "true" : "false");
    }
    botao.addEventListener("click", function () {
      var escuro = raiz.getAttribute("data-bs-theme") === "dark";
      if (escuro) { raiz.removeAttribute("data-bs-theme"); } else { raiz.setAttribute("data-bs-theme", "dark"); }
      try { localStorage.setItem("tema", escuro ? "claro" : "escuro"); } catch (e) {}
      atualizar();
    });
    atualizar();
  })();
</script>
</body>
</html>
